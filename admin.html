<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brume - ON a mission to deliver the greatest coffe</title>

    <!-- links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-text : #30291F;
            --color-accent : #394B32;
            --color-muted : #796A59;
            --color-stage: #E8DBC7;
            --color-border : #dfd5c8;
            --color-background : #FAF7F0;
            --color-selected : #E9EEDC;
            --font-heading: "Bricolage Grotesque", sans-serif;
            --font-body: "DM Sans", sans-serif;
            --font-display: "Playfair Display", serif;
        }
    </style>
</head>
<body class="bg-background">
    <div class="hidden md:flex h-8 w-full bg-accent justify-center items-center text-[#fff] font-body font-400 text-xs">
        <h2>
            Du grain à votre tasse. Un café qui vous ressemble.
        </h2>
    </div>
    
    <header class="flex flex-column md:flex-row justify-between items-center bg-background px-5">
        <div class="max-w-64 h-[40px] flex justify-center items-center gap-1 font-display text-text cursor-pointer">
            <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-coffee preview-icon"
            >
                <path d="M10 2v2"/>
                <path d="M14 2v2"/>
                <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>
                <path d="M6 2v2"/>
            </svg>
            <h2 class="text-lg">BRUME</h2>
        </div>
        
        <nav class="hidden md:flex gap-3">
            <a href="./index.html">L’atelier café</a>
            <a href="#">Notre savoir-faire</a>
            <a href="#">Besoin d’aide ?</a>
        </nav>
        
        <div class="w-12 h-12 flex justify-center items-center text-text gap-1 font-body text-xs cursor-pointer" id="shoppingCart" onclick="toPanier()">
            <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-handbag preview-icon"
            >
                <path d="M2.048 18.566A2 2 0 0 0 4 21h16a2 2 0 0 0 1.952-2.434l-2-9A2 2 0 0 0 18 8H6a2 2 0 0 0-1.952 1.566z"/>
                <path d="M8 11V6a4 4 0 0 1 8 0v5"/>
            </svg>
            <h2>1</h2>
        </div>
    </header>

    <main>       
        <section class="w-full h-[120vh] flex gap-2 pt-4 px-3">
            <figure class="w-full h-full md:w-md bg-stage rounded-3xl px-4 py-2">
                <div class="flex justify-between items-center">
                    <span class="bg-white rounded-3xl py-1 px-1 text-accent font-body font-400 text-sm">LE CAFÉ, À VOTRE FAÇON</span>
                    <span class="text-sm">01 / 04</span>
                </div>
                <img src="assets/images/coffe.png" alt="coffe brume">
                <figcaption class=" flex flex-col justify-center items-center">
                    <h1 class="font-display font-500 md:text-2xl">Un petit rituel. Beaucoup de vous.</h1>
                    <h2 class="font-body font-400 text-xs md:text-sm">ESPRESSO · M · AVOINE · CARAMEL</h2>
                </figcaption>
            </figure>
            <section class="w-4xl rounded-3xl gap-1 text-center flex flex-col" id="form-section">
                <h1 class="font-display font-500 text-xl text-text">Coffe shop</h1>
                <div class="flex flex-col justify-center items-center">
                    <div class="progress-container w-[90%] bg-stage h-3 rounded-xl" id="progressbar">
                        <div class="w-[33%] bg-accent h-full rounded-xl"></div>
                    </div>
                    <div class="breadcrumbs">
                        <ul id="breadcrumbNav">
                            <li><a class="active border-b">Informations Générales</a></li>
                            <li><a>Caractéristiques & Options</a></li>
                            <li><a>Récapitulatif</a></li>
                        </ul>   
                    </div>
                </div>
                <form class="flex justify-between gap-2 w-[90%] self-center px-4 flex-wrap">
                </form>
            </section>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script/admin.js"></script>
</body>
</html>
