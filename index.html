<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUME</title>

    <!-- Links -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="heading">
        <h2 class="txt-sm">Du grain à votre tasse. Un café qui vous ressemble.</h2>
    </div>
    <header>
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-coffee preview-icon"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>
            <h2>BRUME</h2>
        </div>
        <nav>
            <a href="./index.html">L’atelier café</a>
            <a href="#">Notre savoir-faire</a>
            <a href="#">Besoin d’aide ?</a>
        </nav>
        <div class="shopicon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-handbag preview-icon"><path d="M2.048 18.566A2 2 0 0 0 4 21h16a2 2 0 0 0 1.952-2.434l-2-9A2 2 0 0 0 18 8H6a2 2 0 0 0-1.952 1.566z"/><path d="M8 11V6a4 4 0 0 1 8 0v5"/></svg>
            <h2 class="shop-count">1</h2>
        </div>
    </header>
    <main>
        <section class="breadcrumb">
            <h2 class="active">01  Personnaliser </h2> — <h2> 02  Récapitulatif</h2>
        </section>
        <section class="personalize">
            <figure>
                <div class="figheading">
                    <span class="badge">LE CAFÉ, À VOTRE FAÇON</span><span class="date">01 / 04</span>
                </div>
                <img src="assets/images/coffe.png" alt="" srcset="">
                <figcaption>
                    <h2>Un petit rituel. Beaucoup de vous.</h2>
                    <h3>ESPRESSO · M · AVOINE · CARAMEL</h3>
                </figcaption>
            </figure>
            <form class="selection-form">
                <div class="form-heading">
                    <h2>VOTRE COFFEE SHOP, AUTREMENT.</h2>
                    <h1>Votre pause, votre signature.</h1>
                    <h3>Quelques envies, un café unique.<br>À vous de composer la suite.</h3>
                </div>
                <label class="option-title">
                    <h2>01  La base</h2>
                    <p>Choix unique</p>
                </label>
                <div class="selection-menu">
                    <button class="optionbtn optionbtn--selected">
                        <h2>Espresso</h2>
                        <h3>18,00 DH</h3>
                    </button>
                    <button class="optionbtn">
                        <h2>Filtre</h2>
                        <h3>16,00 DH</h3>
                    </button>
                </div>
                <label class="option-title">
                    <h2>02  La taille</h2>
                    <p>Choix unique</p>
                </label>
                <div class="selection-menu">
                    <button class="optionbtn">
                        <h2>S · 150 ml</h2>
                        <h3>Inclus</h3>
                    </button>
                    <button class="optionbtn optionbtn--selected">
                        <h2>M · 250 ml</h2>
                        <h3>+ 4,00 DH</h3>
                    </button>
                    <button class="optionbtn">
                        <h2>L · 350 ml</h2>
                        <h3>+ 8,00 DH</h3>
                    </button>
                </div>
                <label class="option-title">
                    <h2>03  Le lait</h2>
                    <p>Choix unique</p>
                </label>
                <div class="selection-menu">
                    <button class="optionbtn">
                        <h2>Vache</h2>
                        <h3>Inclus</h3>
                    </button>
                    <button class="optionbtn optionbtn--selected">
                        <h2>Avoine</h2>
                        <h3>+ 4,00 DH</h3>
                    </button>
                    <button class="optionbtn">
                        <h2>Amande</h2>
                        <h3>+ 5,00 DH</h3>
                    </button>
                </div>
                <label class="option-title">
                    <h2>04  La touche en plus</h2>
                    <p>Plusieurs choix</p>
                </label>
                <div class="selection-menu">
                    <button class="optionbtn optionbtn--selected">
                        <h2>Caramel</h2>
                        <h3>+ 3,00 DH</h3>
                    </button>
                    <button class="optionbtn">
                        <h2>Vanille</h2>
                        <h3>+ 3,00 DH</h3>
                    </button>
                </div>
                <label><p>Le prix évolue selon vos choix. Vous pourrez les modifier au récapitulatif.</p></label>
            </form>
        </section>
        <section class="total">
            <div class="price-container">
                <h2>Total</h2>
                <div class="price" id="price">
                    <span>29,00</span> DH
                </div>
            </div>
            <input type="button" value="Ajouter au panier   →">
        </section>
    </main>
</body>
</html>
